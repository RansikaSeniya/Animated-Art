<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Sunset Landscape</title>
   
</head>
<body>
    <div class="container">
        <div class="scene">
            <div class="title">Sunset Mountain Landscape</div>
            
            <div class="sky">
                <div class="sun"></div>
                <div class="cloud cloud-1"></div>
                <div class="cloud cloud-2"></div>
                <div class="cloud cloud-3"></div>
                <div class="bird bird-1">🕊
</div>
                <div class="bird bird-2">🐦</div>
            </div>
            
            <div class="mountain mountain-1"></div>
            <div class="mountain mountain-2"></div>
            <div class="mountain mountain-3"></div>
            <div class="mountain mountain-4"></div>
            
            <div class="foreground">
                <div class="tree tree-1">
                    <div class="tree-trunk"></div>
                    <div class="tree-top"></div>
                </div>
                <div class="tree tree-2">
                    <div class="tree-trunk"></div>
                    <div class="tree-top"></div>
                </div>
                <div class="tree tree-3">
                    <div class="tree-trunk"></div>
                    <div class="tree-top"></div>
                </div>
                <div class="tree tree-4">
                    <div class="tree-trunk"></div>
                    <div class="tree-top"></div>
                </div>
                <div class="tree tree-5">
                    <div class="tree-trunk"></div>
                    <div class="tree-top"></div>
                </div>
                <div class="tree tree-6">
                    <div class="tree-trunk"></div>
                    <div class="tree-top"></div>
                </div>
            </div>
            
            <div class="water"></div>
            
            <div class="info">Created with Pure HTML & CSS 😂</div>
        </div>
    </div>
</body>
</html>
