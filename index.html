<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Sunset Landscape</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #1a2980, #26d0ce);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 800px;
            height: 500px;
        }
        
        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }
        
        /* Sky */
        .sky {
            position: absolute;
            width: 100%;
            height: 65%;
            background: linear-gradient(to bottom, #ff7e5f, #feb47b);
        }
        
        /* Sun */
        .sun {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background: #ffdd00;
            border-radius: 50%;
            box-shadow: 0 0 40px 20px rgba(255, 221, 0, 0.6);
            animation: pulse 4s infinite alternate;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="scene">
            <div class="title">Sunset Mountain Landscape</div>
            
            <div class="sky">
                <div class="sun"></div>
                <div class="cloud cloud-1"></div>
                <div class="cloud cloud-2"></div>
                <div class="cloud cloud-3"></div>
                <div class="bird bird-1">🐦</div>
                <div class="bird bird-2">🐦</div>
            </div>
            
            <div class="mountain mountain-1"></div>
            <div class="mountain mountain-2"></div>
            <div class="mountain mountain-3"></div>
            <div class="mountain mountain-4"></div>
            
            <div class="foreground">
                <div class="tree tree-1">
                    <div class="tree-trunk"></div>
                    <div class="tree-top"></div>
                </div>
                <div class="tree tree-2">
                    <div class="tree-trunk"></div>
                    <div class="tree-top"></div>
                </div>
                <div class="tree tree-3">
                    <div class="tree-trunk"></div>
                    <div class="tree-top"></div>
                </div>
                <div class="tree tree-4">
                    <div class="tree-trunk"></div>
                    <div class="tree-top"></div>
                </div>
                <div class="tree tree-5">
                    <div class="tree-trunk"></div>
                    <div class="tree-top"></div>
                </div>
                <div class="tree tree-6">
                    <div class="tree-trunk"></div>
                    <div class="tree-top"></div>
                </div>
            </div>
            
            <div class="water"></div>
            
            <div class="info">Created with Pure HTML & CSS 😂</div>
        </div>
    </div>
</body>
</html>
